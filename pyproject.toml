[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mammo-reliability"
version = "0.2.0"
description = "Reproducible experiments for mammography AI failure detection"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2", "Pillow>=10,<13", "pydicom>=3,<4",
  "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
train = ["torch>=2.4,<3", "torchvision>=0.19,<1", "pylibjpeg>=2,<3", "pylibjpeg-openjpeg>=2,<3", "pylibjpeg-libjpeg>=2,<3"]
dev = ["pytest>=8,<10", "nbformat>=5,<6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mammo_reliability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
